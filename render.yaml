services:
  - type: web
    name: ER-Connect---MERN-END-TERM
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://er-connect-mern-end-term.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CHAT_KEY
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: '@sst.scaler.com'
      - key: MAX_CONCURRENT_CHATS_PER_ER
        value: '3'
